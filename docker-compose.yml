services:
  postgres:
    image: postgres:16-alpine
    container_name: sid_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sid_os}
      POSTGRES_USER: ${POSTGRES_USER:-sid_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sid_os_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sid_os} -d ${POSTGRES_DB:-sid_os}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sid_os_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sid_os}:${POSTGRES_PASSWORD:-sid_os_password}@postgres:5432/${POSTGRES_DB:-sid_os}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
